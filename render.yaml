# Render.com — connect your Git repo and deploy (no local testing required)
# Dashboard: New → Blueprint → select this repo, or New → Web Service manually with these settings.

services:
  - type: web
    name: nautk-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run server:install
    startCommand: npm run server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAIL_TO
        value: contato@nautk.org
      # Add SMTP_* in the Render dashboard for real email (optional for first test)
